<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Playlist – Shuffle Player (Cover Edition)</title>
  <style>
    :root { --bg:#000; --coverH:240px; }
    html,body{margin:0;padding:0;height:100%;background:var(--bg);}
    .cover{
      position:relative;
      height:var(--coverH);
      background-size:cover;
      background-position:center;
      display:flex;align-items:center;justify-content:center;
    }
    .cover::after{
      content:"";
      position:absolute;inset:0;
      background:linear-gradient(to bottom,rgba(0,0,0,0.25),rgba(0,0,0,0.65));
    }
    .cover h1{
      position:relative;z-index:1;
      color:#fff;font-size:clamp(18px,4vw,32px);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
      text-shadow:0 2px 10px rgba(0,0,0,0.4);
      margin:0;
      padding:0 12px;
      text-align:center;
    }
    #player{width:100%;height:calc(100vh - var(--coverH));border:0;}
    @media (max-width:640px){
      :root { --coverH:200px; }
    }
  </style>
</head>
<body>
  <div class="cover" id="cover"><h1 id="title"></h1></div>
  <iframe id="player" allow="autoplay" allowfullscreen></iframe>

  <script>
  // URL 파라미터로 바꿀 수 있는 옵션들 (커버/제목/배경/높이)
  const qs     = new URLSearchParams(location.search);
  const bg     = qs.get('bg');
  const title  = qs.get('title') || '';
  const cover  = qs.get('cover');
  const hQuery = qs.get('h') || qs.get('coverH'); // "320" / "280px" / "30vh"

  // ✅ 네 플레이리스트 ID만 여기 한 번 적기 (하드코딩)
  const list = "PLnFUOWlSpN_i-z2lMeFlo4rvYzlS4g6it";

  // 스타일 적용
  if (bg)    document.documentElement.style.setProperty('--bg', '#' + bg.replace('#',''));
  if (title) document.getElementById('title').textContent = title;
  if (cover) document.getElementById('cover').style.backgroundImage = `url(${cover})`;
  if (hQuery){
    const v = (''+hQuery).trim();
    const val = /vh|px$/.test(v) ? v : `${parseInt(v,10)||240}px`;
    document.documentElement.style.setProperty('--coverH', val);
  }

  // 유튜브 임베드 URL (백틱 + ${encodeURIComponent(list)}만 사용)
  const src = `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(list)}&autoplay=1&mute=1&loop=1&controls=1&rel=0`;
  document.getElementById('player').src = src;
</script>
